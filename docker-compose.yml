version: '3.8'

services:
  mysql-warehouse:
    image: mysql:8.0
    container_name: finvariance_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: budget_variance_db
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./sql/views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./sql/stored_procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl-worker:
    build: .
    container_name: finvariance_etl
    depends_on:
      mysql-warehouse:
        condition: service_healthy
    environment:
      DB_HOST: mysql-warehouse
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: budget_variance_db
    command: python scripts/etl_pipeline.py
